<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>New Tab</title>
    <link rel="icon" type="image/png" href="icons/icon32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="./assets/index-BPKcByTV.css">
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>

    <!-- Bookmarks Bar -->
    <nav class="bookmarks-bar glass" id="bookmarks-bar" aria-label="Bookmarks"></nav>
    <div class="bm-menu glass" id="bm-menu" role="menu" hidden></div>

    <!-- Displacement map for liquid-glass refraction -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="11" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="40" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <!-- Top animal selector bar -->
    <div class="top-bar">
      <div class="choices glass" role="radiogroup" aria-label="Animal"></div>
    </div>

    <!-- Center Stage: Clock, greeting, and search composer -->
    <main class="stage">
      <div class="masthead">
        <div class="clock" id="clock" role="timer" aria-label="Current time" title="Click to toggle 12h / 24h format">
          <span class="clock-time"></span>
        </div>
        <h1 class="greeting">Hello, ekaansh.</h1>
      </div>
      <!-- Google Lens Drag & Drop Zone (Matches Google's Lens drop UI in our visual style) -->
      <div id="lens-drop-overlay" class="lens-drop-overlay glass" hidden>
        <div class="lens-drop-header">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M3 9a2 2 0 0 1 2-2h1.5l1.5-2h8l1.5 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
          <span>Search any image with Google Lens</span>
        </div>
        <div class="lens-drop-zone">
          <span class="lens-drop-text">Drop an image anywhere</span>
        </div>
      </div>

      <form class="composer glass" autocomplete="off">
        <div class="composer-field">
          <svg class="composer-search" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m15.5 15.5 5 5" />
          </svg>
          <textarea name="prompt" rows="1" placeholder="Search the web or type a URL..." aria-label="Search or ask anything"></textarea>
          <button type="button" class="composer-clear" id="composer-clear" aria-label="Clear search" title="Clear" hidden>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="composer-bar">
          <div class="composer-left">
            <label class="pill" for="composer-file-input" role="button" tabindex="0" aria-label="Add tabs or files" title="Add tabs or files">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
              <span>Add tabs or files</span>
            </label>
            <div class="composer-attachments" id="composer-attachments" hidden></div>
          </div>
          <div class="tools">
            <button type="button" class="icon-btn" aria-label="Voice input" title="Voice search">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" />
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
              </svg>
            </button>
            <button type="submit" class="send" aria-label="Search" title="Search (Enter)" disabled>
              <svg class="send-icon-default" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7" />
              </svg>
              <svg class="send-icon-lens" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </button>
          </div>
        </div>
        <input type="file" id="composer-file-input" multiple aria-hidden="true" tabindex="-1" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;" />
        <div class="search-suggestions glass" id="search-suggestions" hidden></div>
      </form>
    </main>

    <!-- Google Voice Search Fullscreen Overlay (Translucent glass style preserving animal canvas) -->
    <div id="voice-search-overlay" class="voice-search-overlay" hidden>
      <div class="voice-search-content glass">
        <button type="button" class="voice-close-btn" id="voice-close-btn" aria-label="Close voice search" title="Close (Esc)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="voice-status-text" id="voice-status-text">Listening...</div>
        <button type="button" class="voice-mic-btn listening" id="voice-mic-btn" aria-label="Microphone" title="Click to speak">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" fill="currentColor"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Chrome MV3 Compliant Entry Point (Zero inline scripts) -->
    <script type="module" src="./assets/app-init.js"></script>
  </body>
</html>
